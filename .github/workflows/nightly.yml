name: Nightly binary

on:
  schedule:
    - cron: '0 18 * * *'   # 每天 UTC 18:00（北京时间次日 02:00）
  workflow_dispatch:
  push:
    branches: [main]       # 有 commit 也立即构建，不必等 nightly

permissions:
  contents: write

concurrency:
  group: nightly-binary
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Skip if no new commit since last nightly
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA="${{ github.sha }}"
          LAST_BODY=$(gh release view nightly --json body -q .body 2>/dev/null || true)
          if echo "$LAST_BODY" | grep -q "$HEAD_SHA"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No new commits since last nightly ($HEAD_SHA). Skipping build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "New commit $HEAD_SHA — building."
          fi

      - name: Install PyInstaller
        if: steps.gate.outputs.skip != 'true'
        run: python -m pip install --upgrade pyinstaller

      - name: Build single-file binary
        if: steps.gate.outputs.skip != 'true'
        run: |
          python -m PyInstaller --onefile --name mpp ^
            --runtime-tmpdir . ^
            --hidden-import mpp.transpose ^
            --hidden-import mpp.diagnostics ^
            --add-data "assets;assets" ^
            mpp.py

      - name: Smoke test binary
        if: steps.gate.outputs.skip != 'true'
        run: |
          .\dist\mpp.exe --version
          .\dist\mpp.exe examples/01_basics.dsl -f musicxml -o smoke.musicxml

      - name: Package
        if: steps.gate.outputs.skip != 'true'
        run: |
          Compress-Archive -Path dist\mpp.exe, LICENSE -DestinationPath mpp-windows.zip -Force

      - name: Publish nightly release
        if: steps.gate.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly (Windows)
          body: |
            Automated nightly build. Commit: ${{ github.sha }}

            `mpp.exe` is standalone — Python is not required.
            MuseScore 4 must be installed separately for `.mscz` / `.pdf` / `.png` output.
          files: mpp-windows.zip
          prerelease: true
