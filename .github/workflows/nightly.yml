name: Nightly

on:
  schedule:
    - cron: '0 12 * * *'   # 每天 UTC 12:00 = 北京时间 20:00
  workflow_dispatch:      # 手动触发（此时跳过「无更新则跳过」的检查）

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Gate — skip if no new commit since last nightly
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger — forcing build."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD_SHA="${{ github.sha }}"
          LAST_BODY=$(gh release view nightly --json body -q .body 2>/dev/null || true)
          if echo "$LAST_BODY" | grep -q "$HEAD_SHA"; then
            echo "No new commits since last nightly ($HEAD_SHA). Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "New commit $HEAD_SHA — building."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- Windows binary ---------------------------------------------
      - name: Install PyInstaller
        if: steps.gate.outputs.skip != 'true'
        run: python -m pip install --upgrade pyinstaller

      - name: Build single-file binary
        if: steps.gate.outputs.skip != 'true'
        shell: pwsh
        run: python -m PyInstaller --onefile --name mpp --runtime-tmpdir . --hidden-import mpp.transpose --hidden-import mpp.diagnostics --add-data "assets;assets" mpp.py

      - name: Smoke test binary
        if: steps.gate.outputs.skip != 'true'
        run: |
          .\dist\mpp.exe --version
          .\dist\mpp.exe examples/01_basics.dsl -f musicxml -o smoke.musicxml

      - name: Package binary
        if: steps.gate.outputs.skip != 'true'
        run: Compress-Archive -Path dist\mpp.exe, LICENSE -DestinationPath mpp-windows.zip -Force

      # ---- VSCode extension -------------------------------------------
      - name: Install extension dependencies
        if: steps.gate.outputs.skip != 'true'
        working-directory: editors/vscode
        run: npm install

      - name: Build extension bundle
        if: steps.gate.outputs.skip != 'true'
        working-directory: editors/vscode
        run: npm run build

      - name: Package .vsix
        if: steps.gate.outputs.skip != 'true'
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce package --allow-missing-repository --skip-license

      # ---- One release containing both artifacts ----------------------
      - name: Publish nightly release
        if: steps.gate.outputs.skip != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Nightly
          body: |
            Automated nightly build. Commit: ${{ github.sha }}

            - `mpp-windows.zip` — standalone Windows binary (Python not required;
              MuseScore 4 needed separately for `.mscz` / `.pdf` / `.png`).
            - `jianpu-dsl-*.vsix` — VSCode extension (highlight / diagnostics / completion).
          files: |
            mpp-windows.zip
            editors/vscode/*.vsix
          prerelease: true

  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Sync mpp sources into web/
        run: python web/sync_mpp.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
