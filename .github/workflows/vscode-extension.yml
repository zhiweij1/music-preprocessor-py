name: VSCode extension

on:
  push:
    branches: [main]
    paths:
      - 'editors/vscode/**'
      - '.github/workflows/vscode-extension.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vscode-extension
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Package .vsix
        run: npx --yes @vscode/vsce package --allow-missing-repository --skip-license

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vscode-extension
          name: VSCode extension (jianpu-dsl)
          body: |
            VSCode extension for 简谱 DSL: syntax highlighting, live diagnostics, completion.

            Install: download the .vsix and run `code --install-extension jianpu-dsl-*.vsix`
            Set `jianpu.pythonPath` if `python` is not on PATH.
          files: editors/vscode/*.vsix
